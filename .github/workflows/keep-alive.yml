name: Keep API warm

# Render's free tier puts the API to sleep after ~15 minutes idle, so the first
# request then takes 30-60s to wake it — which stalls phishing click-tracking
# (a target's click hangs) and the employee portal sign-in. This pings the
# public /health endpoint often enough to keep the instance awake.
#
# GitHub's minimum schedule interval is 5 minutes and scheduled runs can lag
# under load, so 10 minutes is a safe balance against the 15-minute sleep while
# using modest Actions minutes. Tighten to */5 if cold starts still slip through.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Never queue overlapping pings if one run is slow waking a cold instance.
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 70 \
              https://vlumeaware.onrender.com/health || echo 000)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::API /health did not return 200 after 3 attempts"
          exit 1
