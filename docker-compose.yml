services:
  postgres:
    image: postgres:16-alpine
    container_name: vlumeaware-postgres
    environment:
      POSTGRES_USER: vlumeaware
      POSTGRES_PASSWORD: vlumeaware
      POSTGRES_DB: vlumeaware
    ports: ['5432:5432']
    volumes: ['vlumeaware-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vlumeaware']
      interval: 5s
      retries: 10

  # Separate instance so the isolation suite can truncate freely.
  postgres-test:
    image: postgres:16-alpine
    container_name: vlumeaware-postgres-test
    environment:
      POSTGRES_USER: vlumeaware
      POSTGRES_PASSWORD: vlumeaware
      POSTGRES_DB: vlumeaware_test
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vlumeaware']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vlumeaware-redis
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  vlumeaware-pg:
